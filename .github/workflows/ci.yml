name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Prisma's client is generated, not published as source. The store's own
        # `test` script also regenerates, but `build`/`pack:check` need it to exist.
        run: pnpm --filter @tsbouncer/prisma exec prisma generate --schema prisma/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Run examples
        # The examples are the documentation, so they are executable and they are
        # part of the gate: a model that no longer builds fails here, not in a
        # reader's terminal.
        run: pnpm examples

      - name: Build
        run: pnpm build

      - name: Validate packages
        run: pnpm pack:check

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: 'packages/*/coverage/lcov.info'
          include-hidden-files: true
          if-no-files-found: warn
