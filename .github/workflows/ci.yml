name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Prisma's client is generated, not published as source. The store's own
        # `test` script also regenerates, but `build`/`pack:check` need it to exist.
        run: pnpm --filter @tsbouncer/prisma exec prisma generate --schema prisma/schema.prisma

      - name: Versions
        # Eight packages drifting to seven versions is how a consumer ends up with
        # two copies of the kernel. Zero dependencies, no extra runner.
        run: pnpm versions

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Run examples
        # The examples are the documentation the guides link to, so they are
        # executable and they are part of the gate: a model that no longer builds
        # fails here, not in a reader's terminal. Their `test` scripts are picked up
        # by the step above, so a broken scenario fails before the tour even runs.
        run: pnpm examples

      - name: Build
        run: pnpm build

      - name: Validate packages
        run: pnpm pack:check

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: 'packages/*/coverage/lcov.info'
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload the contract report
        # "What does this library actually guarantee?" should be answerable by
        # opening one file, without reading the implementation. Same job, same
        # runner — an artifact is not worth a new machine.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: 'packages/testkit/coverage/contract/report.md'
          include-hidden-files: true
          if-no-files-found: error

  docs:
    name: docs
    # Astro 7 requires Node 22. The library publishes `engines: >=20.11`, and the
    # docs toolchain must not drag that floor up — so this is a separate job on a
    # separate runtime rather than a change to the main one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        # The docs type-check their snippets against the *built* package, so a
        # snippet using an API that does not exist fails here rather than in a
        # reader's terminal.
        run: pnpm build

      - name: Check every documentation snippet
        run: pnpm docs:test

      - name: Build the site
        run: pnpm docs:build

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: 'docs/dist'
          include-hidden-files: true
