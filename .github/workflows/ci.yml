name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token has historically been write on contents. This workflow only
# reads the repo and uploads artifacts, so it asks for nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22 and 24 only, per maintainer decision. Note `engines` still
        # advertises >=20.11 — the floor is claimed, not CI-verified.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Prisma's client is generated, not published as source. The store's own
        # `test` script also regenerates, but `build`/`pack:check` need it to exist.
        run: pnpm --filter @tsbouncer/prisma exec prisma generate --schema prisma/schema.prisma

      - name: Versions
        # Five packages drifting to four versions is how a consumer ends up with
        # two copies of the kernel. Zero dependencies, no extra runner.
        run: pnpm versions

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Run examples
        # The examples are the guides' runnable counterparts, so they are
        # executable and they are part of the gate: a model that no longer builds
        # fails here, not in a reader's terminal. Their `test` scripts are picked up
        # by the step above, so a broken scenario fails before the tour even runs.
        run: pnpm examples

      - name: Build
        run: pnpm build

      - name: Validate packages
        run: pnpm pack:check

      - name: Upload coverage
        # One artifact per run, not one per matrix cell — four copies of the same
        # numbers are four chances for a name collision and nothing else. The glob
        # is `**` because the store plugins live one level deeper.
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: 'packages/**/coverage/lcov.info'
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the contract report
        # "What does this library actually guarantee?" should be answerable by
        # opening one file, without reading the implementation. Same job, same
        # runner — an artifact is not worth a new machine.
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-report
          path: 'packages/testkit/coverage/contract/report.md'
          include-hidden-files: true
          if-no-files-found: error

  docs:
    name: docs
    # Astro 7 requires Node 22. The library publishes `engines: >=20.11`, and the
    # docs toolchain must not drag that floor up — so this is a separate job on a
    # separate runtime rather than a change to the main one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        # The docs type-check their snippets against the *built* package, so a
        # snippet using an API that does not exist fails here rather than in a
        # reader's terminal.
        run: pnpm build

      - name: Check every documentation snippet
        run: pnpm docs:test

      - name: Build the site
        run: pnpm docs:build

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: 'docs/dist'
          include-hidden-files: true
