packages:
  - 'packages/*'
  - 'packages/stores/*'
  - 'examples/*'
  - 'docs'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  turbo: true

# A release younger than a day is skipped, which is what makes the excludes
# below meaningful: pnpm gates `minimumReleaseAgeExclude` on this setting, and
# with the default of 0 every one of them was dead config.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
  - '@hono/node-server@2.1.3'
  - hono@4.13.11
